name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check AI Worker URL
        run: |
          if [ -z "$VITE_AI_WORKER_URL" ]; then
            echo "::warning title=VITE_AI_WORKER_URL is empty::AI evaluation and the chatbot will be disabled in this build. Add it as a repository VARIABLE (Settings > Secrets and variables > Actions > Variables)."
          else
            echo "VITE_AI_WORKER_URL is set (${#VITE_AI_WORKER_URL} characters)."
          fi
        env:
          VITE_AI_WORKER_URL: ${{ vars.VITE_AI_WORKER_URL || secrets.VITE_AI_WORKER_URL }}
      - name: Build
        run: npm run build
        env:
          # The site is served from /<repository-name>/ on GitHub Pages.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public Worker URL (NOT a secret). Set it under Settings > Secrets and variables > Actions > Variables.
          VITE_AI_WORKER_URL: ${{ vars.VITE_AI_WORKER_URL || secrets.VITE_AI_WORKER_URL }}
          VITE_JUDGE0_URL: ${{ vars.VITE_JUDGE0_URL || secrets.VITE_JUDGE0_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
