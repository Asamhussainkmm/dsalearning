name = "dsa-ai-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of browser origins allowed to call the Worker.
# Replace YOUR-GITHUB-USERNAME with your GitHub Pages user. Keep localhost for local dev.
ALLOWED_ORIGINS = "https://asamhussainkmm.github.io,http://localhost:5173,http://localhost:4173"
# First model to try. If your Groq account cannot use it, the Worker automatically tries the other current Groq models.
GROQ_MODEL = "openai/gpt-oss-120b"

# Secret (NOT stored here):  npx wrangler secret put GROQ_API_KEY
